services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: repertoryhub_pocketbase
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
    environment:
      # Ces variables sont utilisées uniquement au premier démarrage
      # pour créer le compte admin initial.
      # Changez-les avant le premier lancement puis supprimez-les si souhaité.
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-admin@repertoryhub.local}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-changeme_secure_password}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repertoryhub_nuxt
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NUXT_PUBLIC_POCKETBASE_URL=http://pocketbase:8090
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
